name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Ensure fixed signing keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/pulse-debug.jks ]; then
            keytool -genkeypair -v -keystore keystore/pulse-debug.jks \
              -storepass pulsekey -keypass pulsekey -alias pulse \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PULSE,O=PULSE,C=NP"
            echo "generated new keystore"
          else
            echo "using committed keystore"
          fi
      - run: gradle assembleDebug --no-daemon --stacktrace
      # The Actions artifact storage quota is account-wide and only recalculates every 6-12h, so
      # uploads stay blocked even after deleting old artifacts. Publish the APKs to a Release instead
      # (Release asset storage is separate) so they can always be downloaded.
      - name: Publish APKs to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" app/build/outputs/apk/*/debug/Emma-*.apk \
            --title "Emma CI build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}" \
            --target "${{ github.sha }}"
