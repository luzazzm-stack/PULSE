name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Ensure fixed signing keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/pulse-debug.jks ]; then
            keytool -genkeypair -v -keystore keystore/pulse-debug.jks \
              -storepass pulsekey -keypass pulsekey -alias pulse \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PULSE,O=PULSE,C=NP"
            echo "generated new keystore"
          else
            echo "using committed keystore"
          fi
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: keystore/pulse-debug.jks
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-debug-apk
          path: app/build/outputs/apk/debug/PULSE-*.apk
          if-no-files-found: error
